<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅❌ 数据知识真假判断</title>
    <link rel="stylesheet" href="css/games.css">
</head>
<body>
    <div class="game-container">
        <a href="index.html" class="back-btn">← 返回目录</a>
        <div class="score-board">
            <div class="score-label">得分</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="timer" id="timer">10</div>
        <div class="game-header">
            <h1>✅❌ 数据知识真假判断</h1>
            <div class="subtitle">判断关于数据的说法是正确还是错误</div>
        </div>

        <div id="startScreen" class="screen">
            <h2>✅❌ 数据知识真假判断</h2>
            <p>屏幕会显示一个关于数据的陈述，你需要在10秒内判断这个说法是<b>正确</b>还是<b>错误</b>。</p>
            <p style="color:var(--text-dim);">适合课堂全班抢答，每人轮流作答！</p>
            <button class="btn btn-primary" id="startBtn" style="font-size:1.5rem;padding:1rem 3rem;">开始挑战</button>
        </div>

        <div id="gameScreen" class="screen hidden" style="background:transparent;">
            <div class="game-area">
                <div style="font-size:1.2rem;color:var(--text-dim);margin-bottom:1rem;">第 <span id="qNum">1</span> / <span id="qTotal">10</span> 题</div>
                <div class="question-box" id="questionBox" style="flex-direction:column;gap:1rem;padding:2rem;">
                    <div id="statement" style="font-size:1.6rem;font-weight:600;line-height:1.6;"></div>
                </div>
                <div style="display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem;">
                    <button class="option-btn" id="optTrue" style="min-width:220px;text-align:center;font-size:1.5rem;padding:1.2rem 2rem;">✅ 正确</button>
                    <button class="option-btn" id="optFalse" style="min-width:220px;text-align:center;font-size:1.5rem;padding:1.2rem 2rem;">❌ 错误</button>
                </div>
                <div id="explanation" style="margin-top:1.5rem;font-size:1.1rem;color:var(--text-dim);min-height:3rem;"></div>
            </div>
        </div>

        <div id="endScreen" class="screen hidden">
            <h2>🎉 挑战完成</h2>
            <p style="font-size:2rem;color:var(--accent);margin:1rem 0;">最终得分：<span id="finalScore">0</span></p>
            <p id="endMessage"></p>
            <div style="display:flex;gap:1rem;justify-content:center;margin-top:2rem;">
                <button class="btn btn-primary" id="restartBtn">再玩一次</button>
                <a href="index.html" class="btn btn-secondary" style="text-decoration:none;">返回目录</a>
            </div>
        </div>
    </div>

    <script src="js/games.js"></script>
    <script>
        const questions = [
            { statement: '数据就是指数字，文字和图像不是数据。', answer: false, explanation: '错误！数据不仅包括数字，还包括文本、图像、音频、视频等各种形式的信息记录。' },
            { statement: '结构化数据可以用二维表格（行列）来表示。', answer: true, explanation: '正确！结构化数据具有预定义的格式，可以用关系型数据库表格存储，如Excel表格。' },
            { statement: '社交媒体上的用户评论属于非结构化数据。', answer: true, explanation: '正确！用户评论是自由文本，没有固定格式，属于典型的非结构化数据。' },
            { statement: '原始数据不需要任何处理就可以直接用于分析。', answer: false, explanation: '错误！原始数据往往存在缺失、错误、重复等问题，需要经过清洗和处理才能用于分析。' },
            { statement: '缺失值、异常值和重复值都属于"脏数据"。', answer: true, explanation: '正确！脏数据是指存在质量问题、不适合直接使用的数据，包括缺失值、异常值、重复值、格式错误等。' },
            { statement: '数据和信息是完全相同的概念，可以互换使用。', answer: false, explanation: '错误！数据是原始的、未经处理的记录；信息是经过加工、具有意义和价值的数据。' },
            { statement: '衍生数据是通过对原始数据进行加工计算得出的数据。', answer: true, explanation: '正确！例如：原始数据是"订单金额"，衍生数据可以是"客单价""销售额汇总"等。' },
            { statement: '数据采集只需要考虑能不能拿到数据，不需要考虑合法性。', answer: false, explanation: '错误！数据采集必须遵守法律法规和平台规则，未经授权爬取数据可能涉及法律风险。' },
            { statement: 'JSON格式的数据属于半结构化数据。', answer: true, explanation: '正确！JSON有标签和层级结构，但不像数据库表那样严格固定，属于半结构化数据。' },
            { statement: '数据量越大，数据分析的结果一定越准确。', answer: false, explanation: '错误！数据质量比数量更重要。如果数据有严重质量问题，数据量再大也可能得出错误结论。' },
            { statement: '数据生命周期包括：采集、清洗、存储、分析、应用、归档/销毁。', answer: true, explanation: '正确！数据从产生到最终处置会经历完整的生命周期，每个阶段都需要科学管理。' },
            { statement: 'CSV文件和Excel文件都可以用来存储结构化数据。', answer: true, explanation: '正确！CSV是纯文本格式，Excel是二进制格式，两者都常用于存储结构化表格数据。' }
        ];

        let currentQ = 0, score = 0, timerObj = null, gameQuestions = [];

        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('restartBtn').onclick = startGame;
        document.getElementById('optTrue').onclick = () => answer(true);
        document.getElementById('optFalse').onclick = () => answer(false);

        function startGame() {
            currentQ = 0; score = 0;
            gameQuestions = shuffle(questions).slice(0, 10);
            document.getElementById('score').textContent = '0';
            document.getElementById('qTotal').textContent = gameQuestions.length;
            document.getElementById('explanation').textContent = '';
            showScreen('game');
            document.getElementById('timer').style.display = 'flex';
            showQuestion();
        }

        function showQuestion() {
            if (currentQ >= gameQuestions.length) {
                endGame();
                return;
            }
            const q = gameQuestions[currentQ];
            document.getElementById('qNum').textContent = currentQ + 1;
            document.getElementById('statement').textContent = q.statement;
            document.getElementById('explanation').textContent = '';

            ['optTrue','optFalse'].forEach(id => {
                document.getElementById(id).className = 'option-btn';
                document.getElementById(id).disabled = false;
            });

            document.getElementById('timer').textContent = '10';
            document.getElementById('timer').classList.remove('warning');
            if (timerObj) timerObj.stop();
            timerObj = startTimer(10, (r) => {
                document.getElementById('timer').textContent = r;
                if (r <= 3) document.getElementById('timer').classList.add('warning');
            }, () => {
                answer(null);
            });
        }

        function answer(choice) {
            if (timerObj) timerObj.stop();
            const q = gameQuestions[currentQ];
            const correct = choice === q.answer;

            if (correct) {
                score += 10;
                updateScore(score);
                showFeedback('✓', 'correct');
                document.getElementById(choice ? 'optTrue' : 'optFalse').classList.add('correct');
            } else {
                showFeedback('✗', 'wrong');
                if (choice !== null) {
                    document.getElementById(choice ? 'optTrue' : 'optFalse').classList.add('wrong');
                }
                document.getElementById(q.answer ? 'optTrue' : 'optFalse').classList.add('correct');
            }

            document.getElementById('explanation').innerHTML = '<span style="color:' + (correct ? 'var(--success)' : 'var(--danger)') + ';">' + q.explanation + '</span>';

            ['optTrue','optFalse'].forEach(id => document.getElementById(id).disabled = true);

            setTimeout(() => {
                currentQ++;
                showQuestion();
            }, 2500);
        }

        function endGame() {
            showScreen('end');
            document.getElementById('timer').style.display = 'none';
            document.getElementById('finalScore').textContent = score;
            let msg = '';
            if (score >= 90) msg = '🏆 数据知识达人！你对数据基础概念了如指掌！';
            else if (score >= 70) msg = '⭐ 表现不错！数据基础很扎实！';
            else if (score >= 50) msg = '💪 还有提升空间，建议多复习数据基础概念！';
            else msg = '📚 建议多复习项目一"认识数据"的内容哦！';
            document.getElementById('endMessage').textContent = msg;
        }

        function showScreen(name) {
            ['startScreen','gameScreen','endScreen'].forEach(id => {
                document.getElementById(id).classList.toggle('hidden', id !== name + 'Screen');
            });
        }
    </script>
</body>
</html>
