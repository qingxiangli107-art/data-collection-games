<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 指标归域快判</title>
    <link rel="stylesheet" href="css/games.css">
    <style>
        .metric-display {
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(236,72,153,0.15));
            border: 2px solid var(--primary);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .metric-label {
            font-size: 1rem;
            color: var(--primary-light);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        .metric-name {
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1.3;
        }
        .domain-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.8rem;
        }
        .domain-btn {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem 0.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            position: relative;
        }
        .domain-btn .key-hint {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        .domain-btn:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateY(-3px);
        }
        .domain-btn.correct {
            background: rgba(16,185,129,0.2);
            border-color: var(--success);
            color: var(--success);
        }
        .domain-btn.wrong {
            background: rgba(239,68,68,0.2);
            border-color: var(--danger);
            color: var(--danger);
        }
        .domain-btn:disabled { cursor: default; }
        .result-banner {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 1.3rem;
            font-weight: 700;
            min-height: 2.5rem;
        }
        .result-banner.ok { color: var(--success); }
        .result-banner.no { color: var(--danger); }
        .combo-badge {
            display: inline-block;
            background: rgba(245,158,11,0.2);
            color: var(--accent);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-left: 0.5rem;
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            font-size: 1rem;
            color: var(--text-dim);
        }
        .stats-row b { color: var(--text); font-size: 1.2rem; }
        @media (max-width: 768px) {
            .domain-buttons { grid-template-columns: repeat(2, 1fr); }
            .metric-name { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="index.html" class="back-btn">← 返回目录</a>
        <div class="score-board">
            <div class="score-label">得分</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="timer" id="timer">60</div>
        <div class="game-header">
            <h1>🎯 指标归域快判</h1>
            <div class="subtitle">60秒内，把数据指标快速归入正确的业务域</div>
        </div>

        <div id="startScreen" class="screen">
            <h2>🎯 指标归域快判</h2>
            <p>屏幕会快速显示一个<b>数据指标名称</b>，请在 <b>60秒</b> 内将它归入正确的业务域。</p>
            <p>按键盘 <b>1-5</b> 或点击按钮作答：归对 <b>+10分</b>，归错 <b>-5分</b> 并显示正确归属。</p>
            <p>连续答对有 <b>连击加成</b>：连击3次以上每次额外+5分！</p>
            <p style="color:var(--text-dim);">可以一人操作键盘，全班喊答案；也可以分组接力PK！</p>
            <button class="btn btn-primary" id="startBtn" style="font-size:1.5rem;padding:1rem 3rem;">开始挑战</button>
        </div>

        <div id="gameScreen" class="screen hidden" style="background:transparent;">
            <div class="game-area">
                <div class="stats-row">
                    <span>剩余指标：<b id="remainCount">25</b></span>
                    <span>连击：<b id="comboCount">0</b></span>
                    <span>正确：<b id="correctCount">0</b> / <span id="doneCount">0</span></span>
                </div>
                <div class="metric-display">
                    <div class="metric-label">📊 请判断这个指标属于哪个业务域？</div>
                    <div class="metric-name" id="metricName"></div>
                </div>
                <div class="domain-buttons" id="domainButtons">
                    <button class="domain-btn" data-domain="0"><span class="key-hint">按 1</span>营销域</button>
                    <button class="domain-btn" data-domain="1"><span class="key-hint">按 2</span>商品域</button>
                    <button class="domain-btn" data-domain="2"><span class="key-hint">按 3</span>渠道域</button>
                    <button class="domain-btn" data-domain="3"><span class="key-hint">按 4</span>物流供应链域</button>
                    <button class="domain-btn" data-domain="4"><span class="key-hint">按 5</span>服务域</button>
                </div>
                <div class="result-banner" id="resultBanner"></div>
            </div>
        </div>

        <div id="endScreen" class="screen hidden">
            <h2>🎉 挑战结束</h2>
            <p style="font-size:2rem;color:var(--accent);margin:1rem 0;">最终得分：<span id="finalScore">0</span></p>
            <p id="endStats" style="font-size:1.1rem;"></p>
            <p id="endMessage"></p>
            <div style="display:flex;gap:1rem;justify-content:center;margin-top:2rem;">
                <button class="btn btn-primary" id="restartBtn">再玩一次</button>
                <a href="index.html" class="btn btn-secondary" style="text-decoration:none;">返回目录</a>
            </div>
        </div>
    </div>

    <script src="js/games.js"></script>
    <script>
        const domainNames = ['营销域', '商品域', '渠道域', '物流供应链域', '服务域'];
        const metrics = [
            // 营销域
            { name: '品牌曝光量', domain: 0 },
            { name: '社交媒体互动量', domain: 0 },
            { name: '新客占比', domain: 0 },
            { name: 'KOL合作曝光量', domain: 0 },
            { name: '话题讨论量', domain: 0 },
            // 商品域
            { name: '新品动销率', domain: 1 },
            { name: '商品热度指标', domain: 1 },
            { name: '产品关联指标', domain: 1 },
            { name: '推荐准确性指标', domain: 1 },
            { name: '商品多样性指标', domain: 1 },
            // 渠道域
            { name: '场均GMV', domain: 2 },
            { name: '粉丝增长率', domain: 2 },
            { name: '带货转化率', domain: 2 },
            { name: '带货口碑评分', domain: 2 },
            { name: '合同履约率', domain: 2 },
            // 物流供应链域
            { name: '准时交货率', domain: 3 },
            { name: '订单准确率', domain: 3 },
            { name: '车辆利用率', domain: 3 },
            { name: '缺货成本', domain: 3 },
            { name: '退货处理成本', domain: 3 },
            // 服务域
            { name: '回答准确率', domain: 4 },
            { name: '转人工率', domain: 4 },
            { name: '平均响应时间', domain: 4 },
            { name: '问题解决率', domain: 4 },
            { name: '有效交互率', domain: 4 }
        ];

        let gameMetrics = [], currentIdx = 0, score = 0, combo = 0, correctCnt = 0, timerObj = null, locked = false;

        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('restartBtn').onclick = startGame;

        document.querySelectorAll('.domain-btn').forEach(btn => {
            btn.addEventListener('click', () => { if (!locked) answer(parseInt(btn.dataset.domain)); });
        });
        document.addEventListener('keydown', (e) => {
            if (locked || document.getElementById('gameScreen').classList.contains('hidden')) return;
            const n = parseInt(e.key);
            if (n >= 1 && n <= 5) answer(n - 1);
        });

        function startGame() {
            gameMetrics = shuffle(metrics);
            currentIdx = 0; score = 0; combo = 0; correctCnt = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('comboCount').textContent = '0';
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('doneCount').textContent = '0';
            document.getElementById('remainCount').textContent = gameMetrics.length;
            showScreen('game');
            document.getElementById('timer').style.display = 'flex';
            showMetric();
            if (timerObj) timerObj.stop();
            timerObj = startTimer(60, (r) => {
                document.getElementById('timer').textContent = r;
                if (r <= 10) document.getElementById('timer').classList.add('warning');
            }, endGame);
        }

        function showMetric() {
            locked = false;
            document.getElementById('resultBanner').textContent = '';
            document.getElementById('resultBanner').className = 'result-banner';
            document.querySelectorAll('.domain-btn').forEach(b => {
                b.classList.remove('correct', 'wrong');
                b.disabled = false;
            });
            if (currentIdx >= gameMetrics.length) {
                endGame();
                return;
            }
            document.getElementById('metricName').textContent = gameMetrics[currentIdx].name;
            document.getElementById('remainCount').textContent = gameMetrics.length - currentIdx;
        }

        function answer(choice) {
            locked = true;
            const m = gameMetrics[currentIdx];
            const correct = choice === m.domain;
            const buttons = document.querySelectorAll('.domain-btn');
            const banner = document.getElementById('resultBanner');

            document.getElementById('doneCount').textContent = currentIdx + 1;

            if (correct) {
                combo++;
                correctCnt++;
                let pts = 10;
                if (combo >= 3) {
                    pts += 5;
                    banner.innerHTML = '✓ 正确！' + domainNames[m.domain] + ' <span class="combo-badge">🔥 连击×' + combo + ' 额外+5</span>';
                } else {
                    banner.textContent = '✓ 正确！属于' + domainNames[m.domain];
                }
                score += pts;
                updateScore(score);
                banner.className = 'result-banner ok';
                buttons[m.domain].classList.add('correct');
            } else {
                combo = 0;
                score = Math.max(0, score - 5);
                updateScore(score);
                banner.textContent = '✗ 错误！"' + m.name + '"属于' + domainNames[m.domain];
                banner.className = 'result-banner no';
                if (choice >= 0 && choice < buttons.length) buttons[choice].classList.add('wrong');
                buttons[m.domain].classList.add('correct');
            }

            document.getElementById('comboCount').textContent = combo;
            document.getElementById('correctCount').textContent = correctCnt;

            setTimeout(() => {
                currentIdx++;
                showMetric();
            }, correct ? 700 : 1600);
        }

        function endGame() {
            if (timerObj) timerObj.stop();
            showScreen('end');
            document.getElementById('timer').style.display = 'none';
            document.getElementById('finalScore').textContent = score;
            const total = currentIdx >= gameMetrics.length ? gameMetrics.length : currentIdx;
            const acc = total > 0 ? Math.round(correctCnt / total * 100) : 0;
            document.getElementById('endStats').textContent = '完成 ' + total + ' 个指标 · 正确 ' + correctCnt + ' 个 · 准确率 ' + acc + '%';
            let msg = '';
            if (score >= 200) msg = '🏆 归域大师！你对五大业务域的指标体系了然于胸！';
            else if (score >= 120) msg = '⭐ 表现不错！大部分指标都能快速准确归域！';
            else if (score >= 60) msg = '💪 还有提升空间，建议对照课件复习各域指标分类！';
            else msg = '📚 建议重新学习五大业务域的指标体系内容哦！';
            document.getElementById('endMessage').textContent = msg;
        }
    </script>
</body>
</html>
